# Adjectives, and the divine attributes that close so many verses. These are
# worth learning as a set: a reader who knows them can finish half the āyāt in
# the Quran from the rhythm alone — إِنَّ اللَّهَ عَلِيمٌ حَكِيمٌ.

words:
  - id: alim
    arabic: 'عَلِيم'
    transliteration: 'ʿalīm'
    pos: adjective
    bn: ['সর্বজ্ঞ']
    en: ['all-knowing']
    root: 'ع ل م'
    frequencyRank: 59
    audio: audio/words/alim.mp3
    tags: [quran, adjectives, faith]
    editorNote: 'عِلْم (জ্ঞান) থেকে। আয়াতের শেষে حَكِيم-এর সাথে জোড়ায় আসে।'
  - id: qadir
    arabic: 'قَدِير'
    transliteration: 'qadīr'
    pos: adjective
    bn: ['সর্বশক্তিমান']
    en: ['all-powerful']
    root: 'ق د ر'
    frequencyRank: 61
    audio: audio/words/qadir.mp3
    tags: [quran, adjectives, faith]
    editorNote: "عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ — 'সব কিছুর উপর ক্ষমতাবান', কুরআনে বহুবার।"
  - id: ghafur
    arabic: 'غَفُور'
    transliteration: 'ghafūr'

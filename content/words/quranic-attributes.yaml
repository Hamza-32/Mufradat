    bn: ['ক্ষমাশীল']
    en: ['most forgiving']
    root: 'غ ف ر'
    frequencyRank: 63
    audio: audio/words/ghafur.mp3
    tags: [quran, adjectives, faith]
    editorNote: 'غَفُورٌ رَحِيمٌ — সবচেয়ে ঘন জোড়াগুলোর একটি।'
  - id: sami

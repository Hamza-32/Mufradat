    arabic: 'إِنْسَان'
    transliteration: 'insān'
    pos: noun
    bn: ['মানুষ', 'ইনসান']
    en: ['human being', 'mankind']
    root: 'أ ن س'
    gender: masculine
    frequencyRank: 45
    audio: audio/words/insan.mp3
    tags: [quran, people]
    editorNote: "نَاس সমষ্টিগত 'লোকজন', আর إِنْسَان একক মানুষ — পার্থক্যটা খেয়াল রাখুন।"

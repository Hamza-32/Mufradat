# Generated from the table in scripts/content-source (kept in git history).
# Every gloss below was written by hand; anything marked needsReview is one I am
# not confident about and would like checked.
#
# TODO: verify — frequencyRank is an editorial ordering by how early a learner
# is likely to meet the word, not a corpus count. Replace from a published
# Quranic frequency list before launch.
#
# Particles and pronouns. Small words, enormous payoff: they are the scaffolding
# of every Quranic sentence, and a learner who knows the nouns but not these
# still cannot read a verse.


# The verbs the Quran actually runs on, across forms I–X. Each carries its
# present tense and, where it helps, its masdar — because the derived forms are
# how one root becomes a whole family of meanings, and a reader who can see
# أَنْزَلَ inside نَزَلَ stops needing a dictionary for every line.


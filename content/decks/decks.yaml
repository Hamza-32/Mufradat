# Deck definitions. `words` is the introduction order, so put the word a
# learner should meet first at the top — not alphabetical, not by frequency
# alone. A deck should open with something recognisable.
#
# Bengali titles are written as Bengali, not as translated English. Where I am
# unsure of the natural phrasing I have marked it.

